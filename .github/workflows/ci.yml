name: Restricted MVP CI

on:
  push:
    branches: [main, codex/versionvault-foundation]
  pull_request:

permissions:
  contents: read

jobs:
  fixture-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install controlled browser
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium
          command -v chromium
      - name: Install pinned top-level test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' -c constraints-ci.txt
          python -m pip install ruff==0.14.6
          python -m pip check
      - name: Static and syntax checks
        run: |
          python -m compileall -q services tests
          ruff check --select E4,E7,E9,F63,F7,F82 services tests
      - name: Local-fixture-only test suite
        env:
          VV_CHROMIUM: /usr/bin/chromium
        run: python -m pytest -q
      - name: Capture resolved dependency inventory
        if: always()
        run: python -m pip freeze --all > ci-installed-dependencies.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-dependencies
          path: ci-installed-dependencies.txt
