[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "versionvault-local-mvp"
version = "0.1.0"
description = "Local-only, security-constrained VersionVault vertical slice"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "playwright>=1.50,<2", "python-multipart>=0.0.9,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["services/api"]

[tool.pytest.ini_options]
pythonpath = ["services/api"]
testpaths = ["tests"]
